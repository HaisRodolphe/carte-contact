<!doctype html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rodolphe HAIS — Carte de contact</title>
<meta name="description" content="Négociateur Technico-Commercial B2B — Ploufragan, Côtes-d'Armor">
<meta property="og:title" content="Rodolphe HAIS — Négociateur Technico-Commercial B2B">
<meta property="og:description" content="Contact professionnel — Ploufragan, Côtes-d'Armor">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;700&family=IBM+Plex+Mono:wght@400;500&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#F1F3F5;
    --card:#FFFFFF;
    --ink:#1A1A1A;
    --ink-soft:#5C6E80;
    --line:#D7DEE4;
    --accent-blue:#47698C;
    --accent-blue-press:#35516D;
    --sidebar-blue:#A4B5C5;
    --grid: rgba(71,105,140,0.06);
  }

  *{box-sizing:border-box;}

  body{
    margin:0;
    min-height:100vh;
    background-color:var(--paper);
    background-image:
      linear-gradient(var(--grid) 1px, transparent 1px),
      linear-gradient(90deg, var(--grid) 1px, transparent 1px);
    background-size:24px 24px;
    display:flex;
    align-items:flex-start;
    justify-content:center;
    padding:40px 16px;
    font-family:'Inter',sans-serif;
    color:var(--ink);
  }

  .card{
    width:100%;
    max-width:400px;
    background:var(--card);
    border:1px solid var(--ink-soft);
    padding:24px 22px 22px;
    box-shadow:0 1px 0 rgba(0,0,0,0.04);
  }

  .doc-header{
    display:flex;
    justify-content:space-between;
    align-items:center;
    font-family:'IBM Plex Mono',monospace;
    font-size:10px;
    letter-spacing:.1em;
    text-transform:uppercase;
    color:var(--ink-soft);
    padding-bottom:12px;
    margin-bottom:22px;
    border-bottom:1px solid var(--ink-soft);
  }

  .photo-frame{
    position:relative;
    width:112px;
    height:112px;
    margin:0 auto 18px;
    padding:9px;
  }
  .photo-frame img{
    width:100%;
    height:100%;
    object-fit:cover;
    display:block;
    filter:grayscale(12%) contrast(1.05);
    background:var(--line);
    border-radius:4px;
  }
  .corner{position:absolute;width:14px;height:14px;border-color:var(--accent-blue);}
  .corner.tl{top:0;left:0;border-top:2px solid;border-left:2px solid;}
  .corner.tr{top:0;right:0;border-top:2px solid;border-right:2px solid;}
  .corner.bl{bottom:0;left:0;border-bottom:2px solid;border-left:2px solid;}
  .corner.br{bottom:0;right:0;border-bottom:2px solid;border-right:2px solid;}

  .name{
    font-family:'Archivo',sans-serif;
    font-weight:700;
    font-size:25px;
    text-align:center;
    letter-spacing:-0.01em;
    margin:0 0 4px;
  }
  .role{
    font-family:'IBM Plex Mono',monospace;
    font-size:11px;
    text-align:center;
    letter-spacing:.04em;
    text-transform:uppercase;
    color:var(--accent-blue);
    margin:0 0 22px;
  }

  .titleblock{
    display:grid;
    grid-template-columns:repeat(3, 1fr);
    border-top:1px solid var(--ink-soft);
    border-bottom:1px solid var(--ink-soft);
    margin-bottom:22px;
  }
  .field{
    padding:10px 8px;
    border-right:1px solid var(--line);
    display:flex;
    flex-direction:column;
    gap:4px;
    text-align:center;
  }
  .field:last-child{border-right:none;}
  .label{
    font-family:'IBM Plex Mono',monospace;
    font-size:8.5px;
    letter-spacing:.06em;
    text-transform:uppercase;
    color:var(--ink-soft);
  }
  .value{
    font-size:12px;
    font-weight:500;
    line-height:1.3;
  }

  .contact-list{
    display:flex;
    flex-direction:column;
    margin-bottom:22px;
  }
  .contact-row{
    display:flex;
    justify-content:space-between;
    align-items:baseline;
    gap:12px;
    padding:12px 2px;
    border-bottom:1px solid var(--line);
    text-decoration:none;
    color:inherit;
  }
  .contact-row:last-child{border-bottom:none;}
  .clabel{
    font-family:'IBM Plex Mono',monospace;
    font-size:10px;
    letter-spacing:.06em;
    text-transform:uppercase;
    color:var(--ink-soft);
    flex-shrink:0;
  }
  .cvalue{
    font-size:13px;
    font-weight:500;
    text-align:right;
    overflow:hidden;
    text-overflow:ellipsis;
    white-space:nowrap;
  }

  .save-btn{
    width:100%;
    padding:16px;
    background:var(--accent-blue);
    color:#fff;
    border:none;
    border-radius:2px;
    font-family:'Inter',sans-serif;
    font-weight:600;
    font-size:14px;
    letter-spacing:.01em;
    cursor:pointer;
    transition:transform .15s ease, background .15s ease;
  }
  .save-btn:active{transform:scale(0.98);background:var(--accent-blue-press);}
  .save-btn:disabled{opacity:.65;cursor:default;transform:none;}
  .save-btn:focus-visible{outline:3px solid #EAF3FF;outline-offset:2px;}

  .foot-note{
    font-family:'IBM Plex Mono',monospace;
    font-size:9px;
    text-align:center;
    color:var(--ink-soft);
    letter-spacing:.04em;
    margin-top:14px;
  }

  a:focus-visible{outline:2px dashed var(--accent-blue);outline-offset:3px;}

  @media (prefers-reduced-motion:reduce){
    .save-btn{transition:none;}
  }

  /* Print styles to produce a compact card for paper */
  @media print {
    body { background: #fff; padding: 0; }
    .card { box-shadow: none; border: none; max-width: 90mm; margin: 10mm auto; }
    body { background-image: none; }
    .save-btn, .doc-header { display: none; }
  }
</style>
</head>
<body>
<main class="card" role="article" aria-label="Fiche contact de Rodolphe HAIS">
  <div class="doc-header">
    <span>Fiche contact</span>
    <span>Réf. RH—001</span>
  </div>

  <div class="photo-frame" aria-hidden="false">
    <!-- Use a single source for the photo data URI in the script below -->
    <img id="portrait" src="data:image/jpeg;base64,/9j/4AAQSkZJRgABAQAAAQABAAD/2wBDAAUDBAQEAwUEBAQFBQUGBwwIBwcHBw8LCwkMEQ8SEhEPERETFhwXExQaFRERGCEYGh0dHx8fExciJCIeJBweHx7/2wBDAQUFBQcGBw4ICA4eFBEUHh4eHh4eHh4eHh4eHh4[...]" alt="Portrait de Rodolphe HAIS" width="112" height="112" loading="lazy">
    <span class="corner tl"></span>
    <span class="corner tr"></span>
    <span class="corner bl"></span>
    <span class="corner br"></span>
  </div>

  <h1 class="name">Rodolphe HAIS</h1>
  <p class="role">Négociateur Technico-Commercial B2B</p>

  <div class="titleblock">
    <div class="field">
      <span class="label">Localisation</span>
      <span class="value">Ploufragan (22)</span>
    </div>
    <div class="field">
      <span class="label">Expérience</span>

  <button id="save-btn" class="save-btn" type="button" aria-live="polite" aria-label="Télécharger la fiche contact">Enregistrer le contact</button>

<!-- Structured data for discoverability -->
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "Person",
  "name": "Rodolphe HAIS",
  "jobTitle": "Négociateur Technico-Commercial B2B",
  "address": {
    "@type": "PostalAddress",
    "addressLocality": "Ploufragan",
    "addressCountry": "France"
  },
  "telephone": "+33 6 28 40 79 87",
  "email": "mailto:rodolphe.hais@gmail.com",
  "sameAs": ["https://www.linkedin.com/in/rodolphe-hais-technico-commercial"]
}
</script>

<script>
  // Single source of truth for the image data URI. Keep the full base64 here or replace with a smaller/hosted image.
  const PHOTO_DATA_URI = document.getElementById('portrait').src;
  // Extract only the base64 payload (after the comma)
  const PHOTO_BASE64 = (PHOTO_DATA_URI && PHOTO_DATA_URI.indexOf(',') !== -1) ? PHOTO_DATA_URI.split(',')[1] : PHOTO_DATA_URI;

  // Fold vCard lines to the recommended 75 characters per line using CRLF + space
  function foldLine(str, limit = 75) {
    if (!str || str.length <= limit) return str;
    const parts = [];
    for (let i = 0; i < str.length; i += limit) {
      parts.push(str.slice(i, i + limit));
    }
    return parts.join('\r\n ');
  }

  function buildVCard() {
    const lines = [
      'BEGIN:VCARD',
      'VERSION:3.0',
      'N:HAIS;Rodolphe;;;',
      'FN:Rodolphe HAIS',
      'TITLE:Négociateur Technico-Commercial B2B',
      'EMAIL;TYPE=WORK:rodolphe.hais@gmail.com',
      'TEL;TYPE=CELL:+33628407987',
      'URL:https://www.linkedin.com/in/rodolphe-hais-technico-commercial',
      'ADR;TYPE=WORK:;;Ploufragan;;;France'
    ];

    // PHOTO line using BASE64 - fold it to avoid parsers rejecting long single lines
    const photoPrefix = 'PHOTO;ENCODING=BASE64;TYPE=JPEG:';
    const photoLine = photoPrefix + PHOTO_BASE64;
    lines.push(foldLine(photoLine));

    lines.push('END:VCARD');

    // Join with CRLF per spec
    return lines.join('\r\n');
  }

  async function downloadVCard() {
    const btn = document.getElementById('save-btn');
    const status = document.getElementById('status');
    const originalText = btn.textContent;
    btn.textContent = 'Préparation...';
    btn.disabled = true;
    status.textContent = 'Préparation du fichier vCard...';

    try {
      const vcard = buildVCard();
      // Use UTF-8 text and a common vCard mime type
      const blob = new Blob([vcard], { type: 'text/vcard;charset=utf-8' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = 'Rodolphe-HAIS.vcf';
      // Some browsers need the anchor appended to the DOM
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
      btn.textContent = 'Contact enregistré ✓';
      status.textContent = 'Fichier .vcf téléchargé — ouvre-le pour importer le contact.';
    } catch (e) {
      console.error(e);
      btn.textContent = 'Erreur — réessaie';
      status.textContent = 'Une erreur est survenue lors de la création du vCard.';
    } finally {
      setTimeout(() => {
        btn.textContent = originalText;
        btn.disabled = false;
      }, 2500);
    }
  }

  document.getElementById('save-btn').addEventListener('click', downloadVCard);
</script>
