<head>

<title>Rodolphe HAIS — Carte de contact</title>
<meta name="description" content="Négociateur Technico-Commercial B2B — Ploufragan, Côtes-d'Armor">
<meta property="og:title" content="Rodolphe HAIS — Négociateur Technico-Commercial B2B">
<meta property="og:description" content="Contact professionnel — Ploufragan, Côtes-d'Armor">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;700&family=IBM+Plex+Mono:wght@400;500&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#F1F3F5;
    --card:#FFFFFF;
    --ink:#1A1A1A;
    --ink-soft:#5C6E80;
    --line:#D7DEE4;
    --accent-blue:#47698C;
    --accent-blue-press:#35516D;
    --sidebar-blue:#A4B5C5;
    --grid: rgba(71,105,140,0.06);
  }

  *{box-sizing:border-box;}

  body{
    margin:0;
    min-height:100vh;
    background-color:var(--paper);
    background-image:
      linear-gradient(var(--grid) 1px, transparent 1px),
      linear-gradient(90deg, var(--grid) 1px, transparent 1px);
    background-size:24px 24px;
    display:flex;
    align-items:flex-start;
    justify-content:center;
    padding:40px 16px;
    font-family:'Inter',sans-serif;
    color:var(--ink);
  }

  .card{
    width:100%;
    max-width:400px;
    background:var(--card);
    border:1px solid var(--ink-soft);
    padding:24px 22px 22px;
    box-shadow:0 1px 0 rgba(0,0,0,0.04);
  }

  .doc-header{
    display:flex;
    justify-content:space-between;
    align-items:center;
    font-family:'IBM Plex Mono',monospace;
    font-size:10px;
    letter-spacing:.1em;
    text-transform:uppercase;
    color:var(--ink-soft);
    padding-bottom:12px;
    margin-bottom:22px;
    border-bottom:1px solid var(--ink-soft);
  }

  .photo-frame{
    position:relative;
    width:112px;
    height:112px;
    margin:0 auto 18px;
    padding:9px;
  }
  .photo-frame img{
    width:100%;
    height:100%;
    object-fit:cover;
    display:block;
    filter:grayscale(12%) contrast(1.05);
    background:var(--line);
  }
  .corner{position:absolute;width:14px;height:14px;border-color:var(--accent-blue);}
  .corner.tl{top:0;left:0;border-top:2px solid;border-left:2px solid;}
  .corner.tr{top:0;right:0;border-top:2px solid;border-right:2px solid;}
  .corner.bl{bottom:0;left:0;border-bottom:2px solid;border-left:2px solid;}
  .corner.br{bottom:0;right:0;border-bottom:2px solid;border-right:2px solid;}

  .name{
    font-family:'Archivo',sans-serif;
    font-weight:700;
    font-size:25px;
    text-align:center;
    letter-spacing:-0.01em;
    margin:0 0 4px;
  }
  .role{
    font-family:'IBM Plex Mono',monospace;
    font-size:11px;
    text-align:center;
    letter-spacing:.04em;
    text-transform:uppercase;
    color:var(--accent-blue);
    margin:0 0 22px;
  }

  .titleblock{
    display:grid;
    grid-template-columns:repeat(3, 1fr);
    border-top:1px solid var(--ink-soft);
    border-bottom:1px solid var(--ink-soft);
    margin-bottom:22px;
  }
  .field{
    padding:10px 8px;
    border-right:1px solid var(--line);
    display:flex;
    flex-direction:column;
    gap:4px;
    text-align:center;
  }
  .field:last-child{border-right:none;}
  .label{
    font-family:'IBM Plex Mono',monospace;
    font-size:8.5px;
    letter-spacing:.06em;
    text-transform:uppercase;
    color:var(--ink-soft);
  }
  .value{
    font-size:12px;
    font-weight:500;
    line-height:1.3;
  }

  .contact-list{
    display:flex;
    flex-direction:column;
    margin-bottom:22px;
  }
  .contact-row{
    display:flex;
    justify-content:space-between;
    align-items:baseline;
    gap:12px;
    padding:12px 2px;
    border-bottom:1px solid var(--line);
    text-decoration:none;
    color:inherit;
  }
  .contact-row:last-child{border-bottom:none;}
  .clabel{
    font-family:'IBM Plex Mono',monospace;
    font-size:10px;
    letter-spacing:.06em;
    text-transform:uppercase;
    color:var(--ink-soft);
    flex-shrink:0;
  }
  .cvalue{
    font-size:13px;
    font-weight:500;
    text-align:right;
    overflow:hidden;
    text-overflow:ellipsis;
    white-space:nowrap;
  }

  .save-btn{
    width:100%;
    padding:16px;
    background:var(--accent-blue);
    color:#fff;
    border:none;
    border-radius:2px;
    font-family:'Inter',sans-serif;
    font-weight:600;
    font-size:14px;
    letter-spacing:.01em;
    cursor:pointer;
    transition:transform .15s ease, background .15s ease;
  }
  .save-btn:active{transform:scale(0.98);background:var(--accent-blue-press);}
  .save-btn:disabled{opacity:.65;cursor:default;transform:none;}
  .save-btn:focus-visible{outline:2px solid var(--accent-blue);outline-offset:2px;}

  .foot-note{
    font-family:'IBM Plex Mono',monospace;
    font-size:9px;
    text-align:center;
    color:var(--ink-soft);
    letter-spacing:.04em;
    margin-top:14px;
  }

  @media (prefers-reduced-motion:reduce){
    .save-btn{transition:none;}
  }
</style>
</head>

  async function buildVCard() {
    const lines = [
      "BEGIN:VCARD",
      "VERSION:3.0",
      "N:HAIS;Rodolphe;;;",
      "FN:Rodolphe HAIS",
      "TITLE:Négociateur Technico-Commercial B2B",
      "EMAIL;TYPE=WORK:rodolphe.hais@gmail.com",
      "TEL;TYPE=CELL:+33628407987",
      "URL:https://www.linkedin.com/in/rodolphe-hais-technico-commercial",
      "ADR;TYPE=WORK:;;;Ploufragan;;;France"
    ];

    // Photo deja en base64 : integration directe, fiable a 100%
    lines.push(`PHOTO;ENCODING=b;TYPE=JPEG:${PHOTO_BASE64}`);

    lines.push("END:VCARD");
    return lines.join("\r\n");
  }

  async function downloadVCard() {
    const btn = document.getElementById("save-btn");
    const texteInitial = btn.textContent;
    btn.textContent = "Préparation...";
    btn.disabled = true;

    try {
      const vcard = await buildVCard();
      const blob = new Blob([vcard], { type: "text/vcard;charset=utf-8" });
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = "Rodolphe-HAIS.vcf";
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
      btn.textContent = "Contact enregistré ✓";
    } catch (e) {
      btn.textContent = "Erreur — réessaie";
    } finally {
      setTimeout(() => {
        btn.textContent = texteInitial;
        btn.disabled = false;
      }, 2500);
    }
  }

  document.getElementById("save-btn").addEventListener("click", downloadVCard);
</script>
